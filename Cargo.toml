[package]
name = "cdhit-rs"
version = "0.1.0"
edition = "2021"
# The vectorised diagonal test uses AVX-512 intrinsics, stable since 1.89.
rust-version = "1.89"
license = "GPL-2.0-only"
description = "A Rust translation of CD-HIT 4.8.1"

# One binary with the six programs as subcommands -- a deviation from upstream, which
# ships six executables. See src/bin/cdhit.rs.
[[bin]]
name = "cdhit"
path = "src/bin/cdhit.rs"

[dependencies]
flate2 = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
