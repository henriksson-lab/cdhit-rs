[[bin]]
name = "cd-hit-2d"
path = "src/bin/cd-hit-2d.rs"

[[bin]]
name = "cd-hit-est-2d"
path = "src/bin/cd-hit-est-2d.rs"

[[bin]]
name = "cd-hit-454"
path = "src/bin/cd-hit-454.rs"

[[bin]]
name = "cd-hit-div"
path = "src/bin/cd-hit-div.rs"
